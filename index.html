.chk .t{flex:1}
.chk .t b{display:block}
.chk .t small{display:block;font-size:.92em;color:var(--ink2);margin-top:2px}
.chk.done .t b{text-decoration:line-through;color:var(--ink2)}
.tag{display:inline-block;font-size:.84em;font-weight:700;padding:2px 8px;line-height:1.4;vertical-align:middle;border-radius:4px;background:#eee7d8;color:var(--ink2);margin-left:4px}
.tag.sf{background:var(--red);color:#fff}
.tag.gov{background:#214e8a;color:#fff}
.tag.exp{background:#5f7a24;color:#fff}
.tag.cond{background:var(--amber);color:#fff}

.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.result{border-left:6px solid var(--ok);background:#f1f7ee;padding:10px 12px;border-radius:8px;margin:10px 0}
.result.warn{border-color:var(--amber);background:#fdf3e3}

.row>b,.row>a{flex:1;text-align:right;overflow-wrap:anywhere}

.city{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;min-height:48px;display:flex;justify-content:space-between;align-items:center}
.h24{color:var(--ok);font-weight:800}.h48{color:#214e8a;font-weight:800}.h72{color:var(--amber);font-weight:800}

summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--red2);font-size:1.02em}

textarea{resize:vertical;line-height:1.45;text-align:left}

const PROTO={
zh:`<ul><li>2024年6月中马签署鲜榴莲输华议定书，同年8月24日起马来西亚鲜榴莲正式出口中国。此前只能出口冷冻整果、果肉和果泥。</li><li>出口鲜榴莲必须来自向马来西亚农业及粮食安全部注册、并获中国海关总署 (GACC) 批准的果园和包装厂；果园须持有 MyGAP 认证。</li><li>发现检疫性有害生物、泥土或植物残体，或来自未注册果园/包装厂，可能导致整批退运、拒绝入境甚至季节性暂停。</li><li>议定书要求 "树熟落果" 的猫山王等品种也须在自然落果前采收并控制成熟度；马方正在制定树上采摘的标准作业程序。</li></ul>`,
en:`<ul><li>Malaysia and China signed the fresh-durian protocol in June 2024; exports of fresh durian began on 24 August 2024. Before that only frozen whole fruit, pulp and purée were allowed.</li><li>Fresh durian must come from orchards and packing houses registered with Malaysia's Ministry of Agriculture and Food Security and approved by China's GACC; orchards need MyGAP certification.</li><li>Quarantine pests, soil or plant debris, or fruit from unregistered orchards/packing houses can lead to the whole consignment being refused and even seasonal suspension.</li><li>Industry guidance says premium varieties such as Musang King should be harvested before they drop naturally; Malaysia is drafting standard procedures for tree-picking.</li></ul>`,
ms:`<ul><li>Malaysia dan China menandatangani protokol durian segar pada Jun 2024; eksport durian segar bermula 24 Ogos 2024. Sebelum itu hanya buah beku, isi dan puri dibenarkan.</li><li>Durian segar mesti datang dari dusun dan rumah pembungkusan yang berdaftar dengan Kementerian Pertanian dan Keterjaminan Makanan Malaysia serta diluluskan GACC China; dusun perlu pensijilan MyGAP.</li><li>Perosak kuarantin, tanah atau sisa tumbuhan, atau buah dari dusun/rumah pembungkusan tidak berdaftar boleh menyebabkan seluruh konsainan ditolak malah penggantungan bermusim.</li><li>Panduan industri menyatakan varieti premium seperti Musang King perlu dituai sebelum gugur secara semula jadi; Malaysia sedang menggubal prosedur petik di pokok.</li></ul>`};

  document.getElementById("dry0").classList.toggle("on",!dry);document.getElementById("dry1").classList.toggle("on",dry);
  document.getElementById("pulp0").classList.toggle("on",!pulp);document.getElementById("pulp1").classList.toggle("on",pulp);
  const active=DOCS.filter(d=>!d.cond||(d.cond==="dry"&&dry)||(d.cond==="pulp"&&pulp));
  const done=active.filter((d,k)=>ticks[key(d)]).length;
  document.getElementById("prog").style.width=(active.length?done/active.length*100:0)+"%";
  document.getElementById("progTxt").textContent=`${done} / ${active.length}`;
  const fs=[["all",ALLW[i]],["exp",BY.exp[i]],["gov",BY.gov[i]],["sf",BY.sf[i]]];
  document.getElementById("docFilter").innerHTML=fs.map(f=>`<button data-fk="df:${f[0]}" class="${docFilter===f[0]?"on":""}" onclick="docFilter='${f[0]}';keepFocus(renderDocs)">${f[1]}</button>`).join("");
  const shown=active.filter(d=>docFilter==="all"||d.by===docFilter);
  document.getElementById("docList").innerHTML=shown.map(d=>{const k=key(d);const on=!!ticks[k];
    return `<label class="chk ${on?"done":""}"><input type="checkbox" data-fk="doc:${k}" ${on?"checked":""} onchange="tick('${k}',this.checked)"><div class="t"><b>${d.n[i]} <span class="tag ${d.by}">${BY[d.by][i]}</span>${d.cond?`<span class="tag cond">${d.cond==="dry"?(lang==="zh"?"含干冰":lang==="en"?"dry ice":"ais kering"):(lang==="zh"?"果肉/食品":lang==="en"?"pulp/food":"isi/makanan")}</span>`:""}</b><small>${d.a}${d.o?" · "+d.o[i]:""}</small></div></label>`;}).join("")||`<p class="note">—</p>`;
}
const key=d=>d.a+"|"+d.n[1];
/* Re-render while keeping keyboard focus on the matching control (data-fk) */
function keepFocus(fn){
  const a=document.activeElement, fk=a&&a.dataset?a.dataset.fk:null;
  fn();
  if(fk){const e=[...document.querySelectorAll("[data-fk]")].find(x=>x.dataset.fk===fk);if(e)e.focus({preventScroll:true});}
}
function tick(k,v){ticks[k]=v;lsSet("de.ticks",JSON.stringify(ticks));keepFocus(renderDocs);}

function renderPlan(){
  const i=li();
  document.getElementById("dayBtns").innerHTML=DAYS.map((d,n)=>`<button data-fk="day:${n}" class="${planDay===n?"on":""}" onclick="planDay=${n};keepFocus(renderPlan)">${d[i]}</button>`).join("");
  const tiers=[24,48,72,0];
  document.getElementById("cityBtns").innerHTML=tiers.map(t=>`<button data-fk="tier:${t}" class="${planTier===t?"on":""}" onclick="planTier=${t};keepFocus(renderPlan)">${TIERW[t][i]}<small>${CITIES.filter(c=>c[2]===t).slice(0,4).map(c=>lang==="zh"?c[0]:c[1]).join(" · ")}${t===0?"…":""}</small></button>`).join("");
  const out=document.getElementById("planOut");
  if(planDay===null||planTier===null){out.innerHTML=`<p class="note">${lang==="zh"?"选择交货日与目的地后显示估算。":lang==="en"?"Pick a handover day and a destination tier to see the estimate.":"Pilih hari serahan dan tahap destinasi untuk melihat anggaran."}</p>`;return;}
  let d=planDay, wait=0;
  while(!FLIGHTDAYS[d]){d=(d+1)%7;wait++;}
  const dn=n=>DAYS[(n)%7][i];
  const arr=(d+1)%7;
  const off=planTier===24?1:planTier===48?2:planTier===72?3:3;
  const dest=(d+off)%7;
  const rows=[];
  if(wait){rows.push(`<div class="result warn"><b>${lang==="zh"?`${dn(planDay)}无货机航班 — 先冷藏，等 ${dn(d)} 航班`:lang==="en"?`No freighter on ${dn(planDay)} — keep the fruit cold and ship on ${dn(d)}`:`Tiada pesawat kargo pada ${dn(planDay)} — simpan sejuk dan hantar pada ${dn(d)}`}</b><div class="note">${lang==="zh"?"顺丰可按需提供冷库 / 冷车临时储存。":lang==="en"?"SF offers cold-room / reefer temporary storage on request.":"SF menyediakan simpanan sementara bilik sejuk / lori sejuk atas permintaan."}</div></div>`);}
  else rows.push(`<div class="result"><b>${lang==="zh"?`当天 ${dn(d)} 即可上货机`:lang==="en"?`Ships on the ${dn(d)} freighter`:`Dihantar dengan pesawat kargo ${dn(d)}`}</b><div class="note">${lang==="zh"?"交货当天 21:50 起飞。截单时间请先致电顺丰确认。":lang==="en"?"Departs 21:50 the same day. Confirm the cut-off time with SF first.":"Berlepas 21:50 hari yang sama. Sahkan masa tutup dengan SF dahulu."}</div></div>`);
  rows.push(`<div class="card"><div class="row"><span>✈ ${lang==="zh"?"起飞 吉隆坡":lang==="en"?"Depart KUL":"Berlepas KUL"}</span><b>${dn(d)} 21:50</b></div><div class="row"><span>🛬 ${lang==="zh"?"抵达 深圳":lang==="en"?"Arrive SZX":"Tiba SZX"}</span><b>${dn(arr)} 02:00</b></div><div class="row"><span>📦 ${lang==="zh"?"预计送达目的地":lang==="en"?"Estimated delivery":"Anggaran tiba"}</span><b>${dn(dest)}${planTier?` (${planTier}H)`:""}</b></div></div>`);
  if(planTier===24)rows.push(`<p class="note">${lang==="zh"?"条件：12点前完成清关。":lang==="en"?"Condition: customs clearance completed before 12:00.":"Syarat: pelepasan kastam selesai sebelum 12:00."}</p>`);
  rows.push(`<p class="note">${lang==="zh"?"手册同时注明：最快 1–2 天送达；偏远地区时效顺延。":lang==="en"?"The brochure also states: fastest 1–2 days; remote areas take longer.":"Risalah juga menyatakan: secepat 1–2 hari; kawasan terpencil lebih lama."}</p>`);
  out.innerHTML=rows.join("");
}

function renderCities(){
  const i=li();
  const fs=[[0,ALLW[i]],[24,"24H"],[48,"48H"],[72,"72H"]];
  document.getElementById("hFilter").innerHTML=fs.map(f=>`<button data-fk="hf:${f[0]}" class="${hFilter===f[0]?"on":""}" onclick="hFilter=${f[0]};keepFocus(renderCities)">${f[1]}</button>`).join("");
  const q=(document.getElementById("citySearch").value||"").trim().toLowerCase();
  const list=CITIES.filter(c=>(!hFilter||c[2]===hFilter)&&(!q||c[0].includes(q)||c[1].toLowerCase().includes(q)));
  document.getElementById("cityGrid").innerHTML=list.map(c=>`<div class="city"><span>${lang==="zh"?c[0]:c[1]+"<br><small>"+c[0]+"</small>"}</span><span class="h${c[2]||''}">${c[2]?c[2]+"H":"3D"}</span></div>`).join("")||`<p class="note">—</p>`;
}
